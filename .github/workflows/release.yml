name: Release

on:
  push:
    branches:
      - dev-chinese_localization
  workflow_dispatch:

jobs:
  build:
    name: Build & Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Sources/NoSleep/NoSleep.csproj

      - name: Build & Publish (.NET 8.0 Release)
        run: dotnet build Sources/NoSleep/NoSleep.csproj -c Release -f net8.0-windows

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoSleep-net8.0
          path: Sources/NoSleep/bin/Release/net8.0-windows/win-x64/publish/
          if-no-files-found: error

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Version
        id: version
        shell: pwsh
        run: |
          $ver = Select-String -Path Sources/NoSleep/NoSleep.csproj -Pattern '<Version>(.*?)</Version>' | ForEach-Object { $_.Matches.Groups[1].Value }
          Write-Host "Version=$ver"
          echo "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: NoSleep-net8.0
          path: release-artifact

      - name: Create Release Tag
        id: tag
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}-zh-CN"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Creating tag: $TAG"

      - name: Pack Artifact
        shell: pwsh
        run: |
          Compress-Archive -Path release-artifact/* -DestinationPath NoSleep-${{ steps.version.outputs.version }}-zh-CN.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: v${{ steps.version.outputs.version }} (zh-CN Localization)
          body: |
            ## NoSleep v${{ steps.version.outputs.version }} — 简体中文版

            - 基于上游 v${{ steps.version.outputs.version }} 版本
            - 新增简体中文 (zh-CN) 本地化支持
            - 构建目标: .NET 8.0 (Windows), 单文件发布
          files: NoSleep-${{ steps.version.outputs.version }}-zh-CN.zip
          draft: false
          prerelease: false
